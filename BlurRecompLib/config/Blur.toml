[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
# Blur Recomp (2026-11-16): tablas de saltos (switch) generadas con un
# XenonAnalyse parcheado (patron LIS,RLWINM,ADDI,LWZX,MTCTR,BCTR que usa
# el compilador de Blur). Sin esto, los bctr de los switch se emitian como
# llamada indirecta a traves de la tabla y el arranque moria llamando a 0.
switch_table_file_path = "blur_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Blur Recomp (2026-11-16): direcciones CRT de guardado/restaurado de registros.
# Sin estas claves el codegen dejaba 18.463 saltos a __restgprlr_* como
# comentarios ERROR y los epilogos no restauraban r28-r31 (bucle en el arranque).
restgprlr_14_address = 0x8294F440
savegprlr_14_address = 0x8294F3F0

